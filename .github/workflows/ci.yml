name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

defaults:
  run:
    working-directory: frontend

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SITE_URL: https://example.test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test

      - name: Production Build
        run: npm run build

      - name: Legal Placeholders Audit
        # Draft placeholders expected pre-launch; exits non-zero to alert reviewers
        run: npm run legal:check || true
