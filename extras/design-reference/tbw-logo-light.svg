<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 48" width="350" height="48" fill="none">
  <!-- THE BUSINESS WORK — Light Background Variant -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap');
      .tbw-wordmark-light {
        font-family: 'Space Grotesk', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 0.18em;
        fill: #181716;
      }
    </style>
  </defs>

  <!-- TBW Monogram (Dark Ink + Ochre) -->
  <g id="tbw-monogram-light" transform="translate(4, 4)">
    <path d="M 2 6 H 20" stroke="#181716" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 11 6 V 18" stroke="#181716" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 2 21 L 6.5 34 L 11 25 L 15.5 34 L 20 21" stroke="#181716" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 25 6 V 34" stroke="#181716" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 25 6 H 34 C 37.5 6 40 8.5 40 12 C 40 15.5 37.5 18 34 18 H 25" stroke="#181716" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 25 18 H 35 C 39 18 41.5 20.8 41.5 25 C 41.5 29.2 39 34 35 34 H 25" stroke="#181716" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="25" cy="6" r="3" fill="#A3512B" />
  </g>

  <!-- Typography Wordmark -->
  <text x="60" y="27" dominant-baseline="central" class="tbw-wordmark-light">
    THE BUSINESS WORK
  </text>
</svg>
