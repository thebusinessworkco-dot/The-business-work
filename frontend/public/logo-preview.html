<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>THE BUSINESS WORK — Official Vector Logo Deliverables</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 48px 24px;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background: #EFEBE1;
      color: #181716;
    }
    .header {
      text-align: center;
      margin-bottom: 36px;
    }
    .header h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    .header p {
      margin: 0;
      font-size: 13px;
      color: #646059;
      letter-spacing: 0.05em;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .card {
      padding: 48px 36px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    }
    .card.cream {
      background: #F7F4EE;
      border: 1px solid #E4DFD5;
      color: #181716;
    }
    .card.dark {
      background: #181716;
      border: 1px solid #2B2926;
      color: #F7F4EE;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 4px;
    }
    .card.cream .badge {
      background: #EFEBE1;
      color: #646059;
    }
    .card.dark .badge {
      background: #252422;
      color: #A3512B;
    }
    .logo-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .icon-strip {
      display: flex;
      align-items: center;
      gap: 24px;
      padding-top: 16px;
      border-top: 1px solid rgba(128,128,128,0.15);
      width: 100%;
      justify-content: center;
    }
    .icon-label {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>THE BUSINESS WORK (TBW)</h1>
    <p>AI Automation & Digital Systems Agency — Official SVG Logo System</p>
  </div>

  <div class="grid">
    <!-- Light/Cream Background (#F7F4EE) -->
    <div class="card cream">
      <div class="badge">Light Theme (#F7F4EE) — Primary Logo</div>

      <!-- Horizontal Full Logo -->
      <div class="logo-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 48" width="350" height="48" fill="none">
          <defs>
            <style>
              @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap');
              .tbw-text-light {
                font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
                font-weight: 700;
                font-size: 18px;
                letter-spacing: 0.18em;
                fill: #181716;
              }
            </style>
          </defs>

          <!-- TBW Monogram (40x40 bounded within 48x48) -->
          <g id="tbw-symbol" transform="translate(4, 4)">
            <!-- Letter T: Top beam & stem -->
            <path d="M 2 6 H 20" stroke="#181716" stroke-width="3.5" stroke-linecap="round" />
            <path d="M 11 6 V 18" stroke="#181716" stroke-width="3.5" stroke-linecap="round" />

            <!-- Letter W: Dual foundational valleys -->
            <path d="M 2 21 L 6.5 34 L 11 25 L 15.5 34 L 20 21" stroke="#181716" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

            <!-- Letter B: Dual continuous loops -->
            <path d="M 25 6 V 34" stroke="#181716" stroke-width="3.5" stroke-linecap="round" />
            <path d="M 25 6 H 34 C 37.5 6 40 8.5 40 12 C 40 15.5 37.5 18 34 18 H 25" stroke="#181716" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 25 18 H 35 C 39 18 41.5 20.8 41.5 25 C 41.5 29.2 39 34 35 34 H 25" stroke="#181716" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

            <!-- Accent Ochre: Precision Automation Node -->
            <circle cx="25" cy="6" r="3" fill="#A3512B" />
          </g>

          <!-- Wordmark -->
          <text x="60" y="27" dominant-baseline="central" class="tbw-text-light">
            THE BUSINESS WORK
          </text>
        </svg>
      </div>

      <!-- Icon Variations -->
      <div class="icon-strip">
        <span class="icon-label">Favicon / App Icon:</span>
        <!-- 48px -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
          <g transform="translate(4, 4)">
            <path d="M 2 6 H 20" stroke="#181716" stroke-width="3.5" stroke-linecap="round" />
            <path d="M 11 6 V 18" stroke="#181716" stroke-width="3.5" stroke-linecap="round" />
            <path d="M 2 21 L 6.5 34 L 11 25 L 15.5 34 L 20 21" stroke="#181716" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 25 6 V 34" stroke="#181716" stroke-width="3.5" stroke-linecap="round" />
            <path d="M 25 6 H 34 C 37.5 6 40 8.5 40 12 C 40 15.5 37.5 18 34 18 H 25" stroke="#181716" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 25 18 H 35 C 39 18 41.5 20.8 41.5 25 C 41.5 29.2 39 34 35 34 H 25" stroke="#181716" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="25" cy="6" r="3" fill="#A3512B" />
          </g>
        </svg>

        <!-- 32px -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="32" height="32" fill="none">
          <g transform="translate(4, 4)">
            <path d="M 2 6 H 20" stroke="#181716" stroke-width="3.5" stroke-linecap="round" />
            <path d="M 11 6 V 18" stroke="#181716" stroke-width="3.5" stroke-linecap="round" />
            <path d="M 2 21 L 6.5 34 L 11 25 L 15.5 34 L 20 21" stroke="#181716" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 25 6 V 34" stroke="#181716" stroke-width="3.5" stroke-linecap="round" />
            <path d="M 25 6 H 34 C 37.5 6 40 8.5 40 12 C 40 15.5 37.5 18 34 18 H 25" stroke="#181716" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 25 18 H 35 C 39 18 41.5 20.8 41.5 25 C 41.5 29.2 39 34 35 34 H 25" stroke="#181716" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="25" cy="6" r="3" fill="#A3512B" />
          </g>
        </svg>

        <!-- 24px -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="24" height="24" fill="none">
          <g transform="translate(4, 4)">
            <path d="M 2 6 H 20" stroke="#181716" stroke-width="3.5" stroke-linecap="round" />
            <path d="M 11 6 V 18" stroke="#181716" stroke-width="3.5" stroke-linecap="round" />
            <path d="M 2 21 L 6.5 34 L 11 25 L 15.5 34 L 20 21" stroke="#181716" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 25 6 V 34" stroke="#181716" stroke-width="3.5" stroke-linecap="round" />
            <path d="M 25 6 H 34 C 37.5 6 40 8.5 40 12 C 40 15.5 37.5 18 34 18 H 25" stroke="#181716" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 25 18 H 35 C 39 18 41.5 20.8 41.5 25 C 41.5 29.2 39 34 35 34 H 25" stroke="#181716" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="25" cy="6" r="3" fill="#A3512B" />
          </g>
        </svg>
      </div>
    </div>

    <!-- Dark Background (#181716) -->
    <div class="card dark">
      <div class="badge">Dark Theme (#181716) — Inverted Logo</div>

      <!-- Horizontal Full Logo -->
      <div class="logo-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 48" width="350" height="48" fill="none">
          <defs>
            <style>
              @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap');
              .tbw-text-dark {
                font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
                font-weight: 700;
                font-size: 18px;
                letter-spacing: 0.18em;
                fill: #F7F4EE;
              }
            </style>
          </defs>

          <!-- TBW Monogram in Cream with Ochre Node -->
          <g id="tbw-symbol-dark" transform="translate(4, 4)">
            <!-- Letter T -->
            <path d="M 2 6 H 20" stroke="#F7F4EE" stroke-width="3.5" stroke-linecap="round" />
            <path d="M 11 6 V 18" stroke="#F7F4EE" stroke-width="3.5" stroke-linecap="round" />

            <!-- Letter W -->
            <path d="M 2 21 L 6.5 34 L 11 25 L 15.5 34 L 20 21" stroke="#F7F4EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

            <!-- Letter B -->
            <path d="M 25 6 V 34" stroke="#F7F4EE" stroke-width="3.5" stroke-linecap="round" />
            <path d="M 25 6 H 34 C 37.5 6 40 8.5 40 12 C 40 15.5 37.5 18 34 18 H 25" stroke="#F7F4EE" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 25 18 H 35 C 39 18 41.5 20.8 41.5 25 C 41.5 29.2 39 34 35 34 H 25" stroke="#F7F4EE" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

            <!-- Accent Ochre Node -->
            <circle cx="25" cy="6" r="3" fill="#A3512B" />
          </g>

          <!-- Wordmark -->
          <text x="60" y="27" dominant-baseline="central" class="tbw-text-dark">
            THE BUSINESS WORK
          </text>
        </svg>
      </div>

      <!-- Icon Variations -->
      <div class="icon-strip">
        <span class="icon-label">Favicon / App Icon:</span>
        <!-- 48px -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
          <g transform="translate(4, 4)">
            <path d="M 2 6 H 20" stroke="#F7F4EE" stroke-width="3.5" stroke-linecap="round" />
            <path d="M 11 6 V 18" stroke="#F7F4EE" stroke-width="3.5" stroke-linecap="round" />
            <path d="M 2 21 L 6.5 34 L 11 25 L 15.5 34 L 20 21" stroke="#F7F4EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 25 6 V 34" stroke="#F7F4EE" stroke-width="3.5" stroke-linecap="round" />
            <path d="M 25 6 H 34 C 37.5 6 40 8.5 40 12 C 40 15.5 37.5 18 34 18 H 25" stroke="#F7F4EE" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 25 18 H 35 C 39 18 41.5 20.8 41.5 25 C 41.5 29.2 39 34 35 34 H 25" stroke="#F7F4EE" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="25" cy="6" r="3" fill="#A3512B" />
          </g>
        </svg>

        <!-- 32px -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="32" height="32" fill="none">
          <g transform="translate(4, 4)">
            <path d="M 2 6 H 20" stroke="#F7F4EE" stroke-width="3.5" stroke-linecap="round" />
            <path d="M 11 6 V 18" stroke="#F7F4EE" stroke-width="3.5" stroke-linecap="round" />
            <path d="M 2 21 L 6.5 34 L 11 25 L 15.5 34 L 20 21" stroke="#F7F4EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 25 6 V 34" stroke="#F7F4EE" stroke-width="3.5" stroke-linecap="round" />
            <path d="M 25 6 H 34 C 37.5 6 40 8.5 40 12 C 40 15.5 37.5 18 34 18 H 25" stroke="#F7F4EE" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 25 18 H 35 C 39 18 41.5 20.8 41.5 25 C 41.5 29.2 39 34 35 34 H 25" stroke="#F7F4EE" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="25" cy="6" r="3" fill="#A3512B" />
          </g>
        </svg>

        <!-- 24px -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="24" height="24" fill="none">
          <g transform="translate(4, 4)">
            <path d="M 2 6 H 20" stroke="#F7F4EE" stroke-width="3.5" stroke-linecap="round" />
            <path d="M 11 6 V 18" stroke="#F7F4EE" stroke-width="3.5" stroke-linecap="round" />
            <path d="M 2 21 L 6.5 34 L 11 25 L 15.5 34 L 20 21" stroke="#F7F4EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 25 6 V 34" stroke="#F7F4EE" stroke-width="3.5" stroke-linecap="round" />
            <path d="M 25 6 H 34 C 37.5 6 40 8.5 40 12 C 40 15.5 37.5 18 34 18 H 25" stroke="#F7F4EE" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 25 18 H 35 C 39 18 41.5 20.8 41.5 25 C 41.5 29.2 39 34 35 34 H 25" stroke="#F7F4EE" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="25" cy="6" r="3" fill="#A3512B" />
          </g>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
