<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- TBW Monogram Icon for Favicon / Avatar / App Tab -->
  <style>
    :root { color-scheme: light dark; }
    .tbw-stroke { stroke: #181716; }
    @media (prefers-color-scheme: dark) {
      .tbw-stroke { stroke: #F7F4EE; }
    }
  </style>
  <g id="tbw-icon" transform="translate(4, 4)">
    <!-- Letter T: Top beam & stem -->
    <path class="tbw-stroke" d="M 2 6 H 20" stroke="#181716" stroke-width="3.5" stroke-linecap="round" />
    <path class="tbw-stroke" d="M 11 6 V 18" stroke="#181716" stroke-width="3.5" stroke-linecap="round" />

    <!-- Letter W: Dual foundational valleys -->
    <path class="tbw-stroke" d="M 2 21 L 6.5 34 L 11 25 L 15.5 34 L 20 21" stroke="#181716" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Letter B: Dual continuous loops -->
    <path class="tbw-stroke" d="M 25 6 V 34" stroke="#181716" stroke-width="3.5" stroke-linecap="round" />
    <path class="tbw-stroke" d="M 25 6 H 34 C 37.5 6 40 8.5 40 12 C 40 15.5 37.5 18 34 18 H 25" stroke="#181716" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    <path class="tbw-stroke" d="M 25 18 H 35 C 39 18 41.5 20.8 41.5 25 C 41.5 29.2 39 34 35 34 H 25" stroke="#181716" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Accent Ochre: Precision Automation Node -->
    <circle cx="25" cy="6" r="3" fill="#A3512B" />
  </g>
</svg>
